<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Voice Assistant</title>
<style>
  :root { --bg:#0a0e1f; --panel:rgba(255,255,255,.05); --border:rgba(255,255,255,.10); --text:#e9ecff;
          --muted:#9aa3c7; --a:#7c6cff; --b:#35d0ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; color:var(--text); overflow:hidden;
    background:radial-gradient(900px 520px at 12% 8%,rgba(124,108,255,.28),transparent 60%),
               radial-gradient(800px 520px at 92% 92%,rgba(53,208,255,.20),transparent 60%), var(--bg); }
  .app { height:100%; max-width:1150px; margin:0 auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; align-items:center; gap:12px; }
  .brand { font-weight:700; font-size:20px; letter-spacing:.3px; }
  .brand span { background:linear-gradient(90deg,var(--b),var(--a)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:12px; color:var(--muted); }
  .switch { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; }
  .switch input { accent-color:var(--a); width:16px; height:16px; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:400px 1fr; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:22px; backdrop-filter:blur(14px);
          -webkit-backdrop-filter:blur(14px); }
  /* ---------- left: orb ---------- */
  .stage { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px; gap:10px; }
  .orb-wrap { position:relative; width:230px; height:230px; display:grid; place-items:center; }
  .orb { width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 30% 28%,#d6f7ff 0,#5fd0ff 22%,#6a5cff 60%,#27155f 100%);
    box-shadow:0 0 50px rgba(106,92,255,.55),0 0 120px rgba(53,208,255,.25),inset 0 0 25px rgba(255,255,255,.25);
    animation:breathe 4s ease-in-out infinite; }
  .ring { position:absolute; inset:0; margin:auto; width:150px; height:150px; border-radius:50%;
          border:2px solid rgba(124,208,255,.55); opacity:0; }
  .spin { position:absolute; inset:0; margin:auto; width:200px; height:200px; border-radius:50%; opacity:0;
          background:conic-gradient(from 0deg,transparent 0 65%,var(--b));
          -webkit-mask:radial-gradient(circle,transparent 63%,#000 65%); mask:radial-gradient(circle,transparent 63%,#000 65%); }
  .bars { position:absolute; display:flex; gap:5px; align-items:center; height:60px; opacity:0; transition:opacity .3s; }
  .bars i { display:block; width:5px; height:10px; border-radius:3px; background:#fff; animation:bar 1s ease-in-out infinite; }
  .bars i:nth-child(2){animation-delay:.12s} .bars i:nth-child(3){animation-delay:.24s}
  .bars i:nth-child(4){animation-delay:.36s} .bars i:nth-child(5){animation-delay:.24s}
  .bars i:nth-child(6){animation-delay:.12s} .bars i:nth-child(7){animation-delay:0s}
  [data-state=listening] .orb { animation:pulse .9s ease-in-out infinite; }
  [data-state=listening] .ring { animation:ripple 1.8s linear infinite; }
  .ring:nth-child(2){animation-delay:.6s!important} .ring:nth-child(3){animation-delay:1.2s!important}
  [data-state=listening] .bars, [data-state=speaking] .bars { opacity:1; }
  [data-state=thinking] .spin { opacity:1; animation:rot 1s linear infinite; }
  [data-state=speaking] .orb { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  @keyframes pulse { 0%,100%{transform:scale(1.02)} 50%{transform:scale(1.12)} }
  @keyframes ripple { 0%{transform:scale(1);opacity:.7} 100%{transform:scale(1.55);opacity:0} }
  @keyframes rot { to{transform:rotate(360deg)} }
  @keyframes bar { 0%,100%{height:10px} 50%{height:46px} }
  #status { font-size:18px; font-weight:600; }
  #live { min-height:20px; font-size:14px; color:var(--muted); text-align:center; max-width:100%; }
  #mic { width:68px; height:68px; border-radius:50%; border:none; cursor:pointer; color:#fff; font-size:28px;
         background:linear-gradient(135deg,var(--a),var(--b)); box-shadow:0 8px 30px rgba(124,108,255,.45);
         transition:transform .15s; margin-top:4px; }
  #mic:hover { transform:scale(1.06); }
  [data-state=listening] #mic { background:linear-gradient(135deg,#ff5f7e,#ff9a5f); box-shadow:0 8px 30px rgba(255,95,126,.5); }
  .hint { font-size:12px; color:var(--muted); }
  /* ---------- right: chat ---------- */
  .chat { display:flex; flex-direction:column; min-height:0; }
  .chat-head { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; font-weight:600; }
  .chat-head button { margin-left:auto; background:none; border:1px solid var(--border); color:var(--muted);
                      border-radius:10px; padding:5px 12px; cursor:pointer; font-size:12px; }
  .chat-head button:hover { color:var(--text); }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; flex-direction:column; max-width:80%; animation:in .25s ease-out; }
  @keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .row.user { align-self:flex-end; align-items:flex-end; }
  .bubble { padding:10px 15px; border-radius:18px; line-height:1.5; font-size:15px; white-space:pre-wrap; word-wrap:break-word; }
  .user .bubble { background:linear-gradient(135deg,var(--a),#5b7cff); border-bottom-right-radius:5px; }
  .bot .bubble { background:rgba(255,255,255,.08); border:1px solid var(--border); border-bottom-left-radius:5px; }
  .meta { display:flex; gap:6px; margin-top:5px; }
  .tag { font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:20px; padding:2px 9px; }
  .tag.bad { color:#ff8aa0; border-color:rgba(255,138,160,.4); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 10px; }
  .chips button { background:rgba(255,255,255,.07); border:1px solid var(--border); color:var(--text); border-radius:20px;
                  padding:6px 13px; font-size:13px; cursor:pointer; }
  .chips button:hover { background:rgba(124,108,255,.25); }
  form { display:flex; gap:10px; padding:14px; border-top:1px solid var(--border); }
  input[type=text] { flex:1; padding:12px 16px; border-radius:14px; border:1px solid var(--border);
                     background:rgba(0,0,0,.25); color:var(--text); font-size:15px; outline:none; }
  input[type=text]:focus { border-color:var(--a); }
  form button { border:none; border-radius:14px; padding:0 22px; color:#fff; font-size:15px; cursor:pointer;
                background:linear-gradient(135deg,var(--a),var(--b)); }
  footer { text-align:center; font-size:11px; color:var(--muted); }
  @media (max-width:860px) {
    body { overflow:auto; } .app { height:auto; min-height:100%; }
    main { grid-template-columns:1fr; } .chat { height:70vh; }
    .orb-wrap { transform:scale(.8); margin:-20px 0; }
  }
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">
  <header>
    <div>
      <div class="brand">AI <span>Voice Assistant</span></div>
      <div class="sub">NLP intent classification &middot; speech processing</div>
    </div>
    <label class="switch"><input type="checkbox" id="voiceOut" checked> Voice replies</label>
  </header>

  <main>
    <section class="card stage">
      <div class="orb-wrap">
        <div class="spin"></div>
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="orb"></div>
        <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div id="status">Tap the mic and speak</div>
      <div id="live"></div>
      <button id="mic" type="button" title="Speak">&#127908;</button>
      <div class="hint">Try: &ldquo;what time is it&rdquo; &middot; &ldquo;tell me a joke&rdquo;</div>
    </section>

    <section class="card chat">
      <div class="chat-head">Conversation <button id="clear" type="button">Clear</button></div>
      <div id="log"></div>
      <div class="chips" id="chips">
        <button type="button">What time is it?</button>
        <button type="button">Tell me a joke</button>
        <button type="button">Calculate 12 times 4</button>
        <button type="button">Search python tutorials on Google</button>
        <button type="button">Who is Albert Einstein?</button>
        <button type="button">Open YouTube</button>
      </div>
      <form id="form">
        <input type="text" id="msg" autocomplete="off" placeholder="Type a command or press the mic...">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <footer>Speech-to-text &rarr; TF-IDF + Logistic Regression intent model &rarr; skills &rarr; text-to-speech</footer>
</div>

<script>
const app = document.getElementById('app'), log = document.getElementById('log'),
      status = document.getElementById('status'), live = document.getElementById('live'),
      msg = document.getElementById('msg'), mic = document.getElementById('mic'),
      voiceOut = document.getElementById('voiceOut');
const TEXT = { idle:'Tap the mic and speak', listening:'Listening...', thinking:'Thinking...', speaking:'Speaking...' };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, busy = false;

function setState(s) { app.dataset.state = s; status.textContent = TEXT[s]; }

function add(role, text, meta) {
  const row = document.createElement('div'); row.className = 'row ' + role;
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text; row.appendChild(b);
  if (meta) {
    const m = document.createElement('div'); m.className = 'meta';
    const t1 = document.createElement('span'); t1.className = 'tag' + (meta.understood ? '' : ' bad');
    t1.textContent = (meta.understood ? 'intent: ' + meta.intent : 'not understood') + ' \u00b7 ' + meta.confidence.toFixed(2);
    m.appendChild(t1); row.appendChild(m);
  }
  log.appendChild(row); log.scrollTop = log.scrollHeight;
}

function speak(text) {
  if (!voiceOut.checked || !('speechSynthesis' in window)) { setState('idle'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.slice(0, 400)); u.rate = 1;
  u.onstart = () => setState('speaking');
  u.onend = u.onerror = () => setState('idle');
  speechSynthesis.speak(u);
}

async function send(text) {
  text = text.trim(); if (!text || busy) return;
  busy = true; document.getElementById('chips').style.display = 'none';
  add('user', text); live.textContent = ''; setState('thinking');
  try {
    const r = await fetch('/command', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ text }) });
    if (!r.ok) throw new Error('Server error ' + r.status);
    const d = await r.json();
    add('bot', d.reply, d); speak(d.reply);
  } catch (e) { add('bot', 'Sorry, something went wrong: ' + e.message); setState('idle'); }
  busy = false;
}

async function serverListen() {            // fallback: record with the Python microphone code
  setState('listening'); live.textContent = 'Recording from your microphone...';
  try {
    const r = await fetch('/listen', { method:'POST' });
    if (!r.ok) throw new Error((await r.json()).detail || 'microphone not available');
    const d = await r.json();
    if (d.text) await send(d.text); else { live.textContent = "I didn't catch that. Try again."; setState('idle'); }
  } catch (e) { live.textContent = e.message; setState('idle'); }
}

function startVoice() {
  speechSynthesis && speechSynthesis.cancel();
  if (!SR) return serverListen();
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { setState('listening'); live.textContent = ''; };
  rec.onresult = e => {
    let t = ''; for (const res of e.results) { t += res[0].transcript; if (res.isFinal) finalText = t; }
    live.textContent = '\u201c' + t + '\u201d';
  };
  rec.onerror = e => {
    live.textContent = e.error === 'not-allowed' ? 'Microphone blocked. Allow it in the browser address bar.'
                     : e.error === 'no-speech' ? "I didn't hear anything. Try again." : 'Speech error: ' + e.error;
    setState('idle');
  };
  rec.onend = () => { if (finalText) send(finalText); else if (app.dataset.state === 'listening') setState('idle'); };
  rec.start();
}

mic.addEventListener('click', () => { if (app.dataset.state === 'listening' && rec) rec.stop(); else startVoice(); });
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); const t = msg.value; msg.value = ''; send(t); });
document.querySelectorAll('#chips button').forEach(b => b.addEventListener('click', () => send(b.textContent.replace('?', ''))));
document.getElementById('clear').addEventListener('click', () => {
  log.innerHTML = ''; document.getElementById('chips').style.display = 'flex'; live.textContent = '';
  speechSynthesis && speechSynthesis.cancel(); setState('idle'); welcome();
});
function welcome() { add('bot', "Hello! I'm your AI voice assistant. Tap the mic and speak, or type a command. Say \"help\" to see what I can do."); }
welcome();
</script>
</body>
</html>
